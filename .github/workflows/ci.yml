name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  higiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nenhum arquivo de ambiente ou banco versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.(db|sqlite|tfstate)$' | grep -v '\.env\.example$'; then
            echo 'Arquivo proibido versionado'; exit 1
          fi
  privacidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paginas publicas sem dado pessoal
        run: python confiabilidade/auditoria_privacidade.py vitrine
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt e validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependencias
        run: pip install -q duckdb pyarrow dbt-duckdb "pyspark>=3.5,<4.1"
      - name: Dados sinteticos e gold do dbt
        run: |
          python ingestao/sintetico.py /tmp/landing --dias 30
          cd transformacao
          DUCKDB_PATH=/tmp/p.duckdb LANDING_DIR=/tmp/landing dbt build --profiles-dir . --select +gold_radar_demanda
      - name: Job Spark (memoria limitada a 512 MB) e conferencia com o dbt
        run: |
          python spark/gold_radar_demanda.py /tmp/landing /tmp/spark_out --memoria 512m
          python spark/conferir_com_dbt.py /tmp/p.duckdb /tmp/spark_out
