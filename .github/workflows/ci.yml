name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  higiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nenhum arquivo de ambiente ou banco versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.(db|sqlite|tfstate)$' | grep -v '\.env\.example$'; then
            echo 'Arquivo proibido versionado'; exit 1
          fi
  privacidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paginas publicas sem dado pessoal
        run: python confiabilidade/auditoria_privacidade.py vitrine
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt e validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependencias
        run: pip install -q duckdb pyarrow dbt-duckdb "pyspark>=3.5,<4.1"
      - name: Dados sinteticos e gold do dbt
        run: |
          python ingestao/sintetico.py /tmp/landing --dias 30
          cd transformacao
          DUCKDB_PATH=/tmp/p.duckdb LANDING_DIR=/tmp/landing dbt build --profiles-dir . --select +gold_radar_demanda
      - name: Job Spark (memoria limitada a 512 MB) e conferencia com o dbt
        run: |
          python spark/gold_radar_demanda.py /tmp/landing /tmp/spark_out --memoria 512m
          python spark/conferir_com_dbt.py /tmp/p.duckdb /tmp/spark_out
  azure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Azure fmt e validate
        working-directory: infra/terraform-azure
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install -q duckdb pyarrow dbt-duckdb azure-storage-blob azure-identity
      - name: Gold de teste
        run: |
          python ingestao/sintetico.py /tmp/landing --dias 30
          (cd transformacao && DUCKDB_PATH=/tmp/p.duckdb LANDING_DIR=/tmp/landing dbt build --profiles-dir . --select +gold_radar_demanda)
          mkdir -p /tmp/gold/gold_radar_demanda
          python -c "import duckdb;duckdb.connect('/tmp/p.duckdb',read_only=True).execute(\"copy gold_radar_demanda to '/tmp/gold/gold_radar_demanda/dados.parquet' (format parquet)\")"
      - name: Azurite - criar, publicar, conferir e destruir (2 ciclos)
        run: |
          npm install -g azurite --silent
          (azurite-blob --silent --location /tmp/az --skipApiVersionCheck &)
          for i in $(seq 1 40); do (echo > /dev/tcp/127.0.0.1/10000) 2>/dev/null && break; sleep 2; done
          AZURE_STORAGE_CONNECTION_STRING="UseDevelopmentStorage=true" python infra/terraform-azure/teste-azurite.py /tmp/gold
  gcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform GCP fmt e validate
        working-directory: infra/terraform-gcp
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
