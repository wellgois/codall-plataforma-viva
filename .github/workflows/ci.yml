name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  higiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nenhum arquivo de ambiente ou banco versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.(db|sqlite|tfstate)$' | grep -v '\.env\.example$'; then
            echo 'Arquivo proibido versionado'; exit 1
          fi
  privacidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paginas publicas sem dado pessoal
        run: python confiabilidade/auditoria_privacidade.py vitrine
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt e validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
